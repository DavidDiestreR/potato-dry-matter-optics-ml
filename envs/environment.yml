name: quality_pipeline_env
channels:
  - conda-forge
  - defaults

dependencies:
  # -------------------------------------------------
  # Python
  # -------------------------------------------------
  - python=3.10

  # -------------------------------------------------
  # CUDA + cuDNN (compatibles amb TF 2.10)
  # -------------------------------------------------
  - cudatoolkit=11.2
  - cudnn=8.1.0

  # -------------------------------------------------
  # Base científica
  # -------------------------------------------------
  - numpy=1.24.3
  - pandas=2.0.3
  - scikit-learn=1.3.0
  - scipy=1.11.4

  # -------------------------------------------------
  # Visualització (compatibles amb NumPy 1.24)
  # -------------------------------------------------
  - matplotlib=3.7.2
  - seaborn=0.12.2

  # -------------------------------------------------
  # Imatges
  # -------------------------------------------------
  - pillow=10.4.0

  # -------------------------------------------------
  # Jupyter
  # -------------------------------------------------
  - jupyterlab
  - ipykernel

  # -------------------------------------------------
  # Pip (Tot el que depèn de OpenCV / Roboflow)
  # -------------------------------------------------
  - pip
  - pip:
      # TensorFlow
      - tensorflow==2.10.0
      - typing_extensions>=4.4

      # Roboflow + inferència
      - roboflow
      - inference
      - supervision

      # OpenCV
      - opencv-python==4.10.0.84
      - opencv-contrib-python==4.10.0.84